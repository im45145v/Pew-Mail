version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-pewmail}:${POSTGRES_PASSWORD:-pewmail_dev_password}@postgres:5432/${POSTGRES_DB:-pewmail}}
      - SECRET_KEY=${SECRET_KEY:-your_secret_key_here_change_in_production}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload